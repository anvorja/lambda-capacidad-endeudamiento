# CI/CD de lambda-capacidad-endeudamiento. Los tres jobs se llaman exactamente como los exigen las rulesets de main y develop
# (Settings > Rules): "Lint", "Calidad y build" e "Imagen Docker". Si renombras uno, actualiza la ruleset.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Cualquier advertencia del compilador (-Xlint:all) rompe la compilacion
      - name: Java sin advertencias del compilador
        run: ./gradlew -I .github/ci/xlint.init.gradle compileJava compileTestJava --console=plain

  calidad-y-build:
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Pruebas unitarias, arquitectura (ArchUnit), pruebas contra LocalStack (Docker del runner), cobertura minima del 90%
      # en dominio y aplicacion, y el jar de despliegue
      - name: Build, pruebas y cobertura
        run: ./gradlew build --console=plain

      - name: Resumen de cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          try:
              xml = open('build/reports/jacoco/test/jacocoTestReport.xml').read()
          except OSError:
              print('Sin reporte de cobertura')
          else:
              print('| Contador | Cobertura (todo el codigo) |\n|---|---|')
              for tipo, nombre in (('LINE', 'Lineas'), ('BRANCH', 'Ramas')):
                  perdidas, cubiertas = map(int, re.findall(r'<counter type="%s" missed="(\d+)" covered="(\d+)"/>' % tipo, xml)[-1])
                  print('| %s | %.1f%% |' % (nombre, 100 * cubiertas / (perdidas + cubiertas)))
          PY

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          retention-days: 14
          path: |
            build/reports/jacoco
            build/reports/tests
            build/test-results

  imagen-docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [lint, calidad-y-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Una Lambda no se despliega como contenedor: la etapa "artifact" del Dockerfile compila el jar de despliegue
      # de forma reproducible (mismo JDK que en produccion) y aqui se extrae
      - name: Construir el jar de despliegue
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          load: true
          tags: lambda-capacidad-endeudamiento-artifact:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer el jar
        run: |
          mkdir -p dist
          contenedor="$(docker create lambda-capacidad-endeudamiento-artifact:ci)"
          docker cp "$contenedor:/artifact/lambda-capacidad-endeudamiento.jar" dist/lambda-capacidad-endeudamiento.jar
          docker rm "$contenedor"
          unzip -tq dist/lambda-capacidad-endeudamiento.jar
          ls -lh dist

      # CD: el jar queda disponible para desplegarlo en Lambda (o subirlo a S3) desde cualquier ejecucion
      - name: Publicar el jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lambda-capacidad-endeudamiento.jar
          retention-days: 30
          if-no-files-found: error
          path: dist/lambda-capacidad-endeudamiento.jar
